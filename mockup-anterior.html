<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Let's PartIA — Maqueta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a; --surface: #111111; --card: #161616; --border: #262626; --border2: #383838;
    --orange: #E9682E; --orange2: #c94f18; --neon: #39FF14; --yellow: #FFE600;
    --text: #F5F5F5; --muted: #aaaaaa; --dim: #6b6b6b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: 'Space Grotesk', system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; }
  button { font-family: inherit; }

  /* HEADER */
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .brand { font-size: 20px; font-weight: 800; letter-spacing: -0.7px; }
  .brand span { color: var(--orange); }
  .brand small { display: block; font-size: 11px; color: var(--dim); font-weight: 500; letter-spacing: 0; }
  .powered { font-size: 11px; color: var(--dim); }
  .powered b { color: var(--orange); }
  .mock-tag { font-size: 11px; color: var(--yellow); border: 1px solid #3a3400; border-radius: 20px; padding: 3px 10px; }

  .tabs { display: flex; gap: 4px; }
  .tab { background: none; border: none; color: var(--muted); font-size: 14px; font-weight: 600; padding: 8px 14px; border-radius: 20px; cursor: pointer; }
  .tab:hover { color: var(--text); background: var(--surface); }
  .tab.on { color: var(--text); background: var(--card); box-shadow: inset 0 0 0 1px var(--border2); }
  .tab sup { font-size: 9px; color: var(--yellow); margin-left: 3px; font-weight: 500; }
  .top-right { display: flex; align-items: center; gap: 16px; }
  .saved { background: none; border: 1px solid var(--border2); color: var(--text); border-radius: 20px; padding: 7px 13px; font-size: 13px; cursor: pointer; }

  /* LAYOUT */
  .app { flex: 1; display: grid; grid-template-columns: 500px 1fr; min-height: 0; }
  .side { border-right: 1px solid var(--border); padding: 20px 26px 18px; display: flex; flex-direction: column; gap: 17px; overflow-y: auto; }
  .side .search { margin-top: auto; position: sticky; bottom: 0; box-shadow: 0 -12px 18px var(--bg); }
  .main-wrap { display: flex; flex-direction: column; min-height: 0; position: relative; }
  .main { flex: 1; overflow-y: auto; padding: 24px 28px 30px; }

  /* CIUDAD */
  .city { position: relative; }
  .city select {
    width: 100%; appearance: none; background: var(--surface); color: var(--text);
    border: 1px solid var(--border2); border-radius: 12px; padding: 11px 40px 11px 42px;
    font: 700 16px 'Space Grotesk', sans-serif; letter-spacing: -0.4px; cursor: pointer;
  }
  .city select:focus { outline: none; border-color: var(--orange); }
  .city::before { content: '📍'; position: absolute; left: 15px; top: 50%; transform: translateY(-50%); font-size: 17px; pointer-events: none; }
  .city::after { content: '▾'; position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }

  /* FILTROS */
  .group h4, .city-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 8px; display: block; }
  .group h4 em { font-style: normal; text-transform: none; letter-spacing: 0; color: var(--dim); font-weight: 500; margin-left: 4px; }
  .chips { display: flex; flex-wrap: nowrap; gap: 6px; }
  .chip {
    background: transparent; border: 1px solid var(--border2); color: var(--muted);
    padding: 8px 11px; border-radius: 20px; font-size: 12.5px; font-weight: 500; cursor: pointer; transition: all .12s; white-space: nowrap;
  }
  .chip:hover { border-color: var(--muted); color: var(--text); }
  .chip.on { background: var(--orange); border-color: var(--orange); color: #fff; font-weight: 600; }
  .chip small { opacity: .75; font-weight: 400; margin-left: 4px; font-size: 11px; }

  .search {
    background: var(--orange); color: #fff; border: none; border-radius: 12px; padding: 14px;
    font-size: 15px; font-weight: 700; cursor: pointer; letter-spacing: -0.2px; transition: background .12s;
  }
  .search:hover { background: var(--orange2); }

  .ask { margin-top: auto; border-top: 1px solid var(--border); padding-top: 16px; display: flex; flex-direction: column; gap: 8px; }
  .ask label { font-size: 13px; color: var(--muted); }
  .ask-row { display: flex; gap: 8px; }
  .ask input {
    flex: 1; background: var(--surface); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 12px 14px; font: 14px 'Space Grotesk', sans-serif; outline: none;
  }
  .ask input:focus { border-color: var(--orange); }
  .ask button { width: 44px; border-radius: 10px; border: 1px solid var(--border2); background: transparent; color: var(--text); cursor: pointer; font-size: 16px; }
  .bot-note { font-size: 13px; color: var(--text); background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; display: none; line-height: 1.45; }
  .bot-note.show { display: block; }

  /* RESULTADOS */
  .res-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 6px; flex-wrap: wrap; }
  .res-head h2 { font-size: 24px; font-weight: 700; letter-spacing: -0.8px; }
  .res-head h2 span { color: var(--orange); }
  .res-sub { font-size: 13px; color: var(--dim); margin-bottom: 18px; }
  .active { display: flex; gap: 6px; flex-wrap: wrap; }
  .active span { font-size: 12px; color: var(--muted); border: 1px solid var(--border); border-radius: 20px; padding: 3px 10px; }

  .day { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1.2px; margin: 22px 0 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 10px; }

  .card {
    display: grid; grid-template-columns: 50px 1fr; gap: 12px; background: var(--card);
    border: 1px solid var(--border); border-radius: 12px; padding: 12px 13px; transition: border-color .12s, transform .12s;
  }
  .card:hover { border-color: #4a4a4a; transform: translateY(-1px); }
  .date { border: 1.5px solid var(--border2); border-radius: 10px; text-align: center; overflow: hidden; align-self: start; }
  .date .dw { font-size: 9px; font-weight: 700; letter-spacing: 1.2px; color: var(--muted); border-bottom: 1.5px solid var(--border2); padding: 4px 0 3px; }
  .date .dn { font-size: 19px; font-weight: 700; letter-spacing: -1px; padding: 5px 0 0; line-height: 1.1; }
  .date .dm { font-size: 9px; font-weight: 600; color: var(--dim); letter-spacing: 1px; padding-bottom: 6px; }
  .body { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .town { font-size: 10.5px; font-weight: 600; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; }
  .title { font-size: 14.5px; font-weight: 700; letter-spacing: -0.4px; line-height: 1.25; }
  .where { font-size: 12.5px; color: var(--text); opacity: .85; }
  .where b { font-weight: 600; }
  .who { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
  .tag { font-size: 11.5px; color: var(--muted); background: #222; border-radius: 6px; padding: 3px 8px; }
  .price { font-size: 11.5px; font-weight: 700; letter-spacing: .5px; padding: 3px 8px; border-radius: 6px; margin-left: auto; }
  .p-gratis { color: var(--neon); background: #0a2410; }
  .p-barato { color: #9be36a; background: #132010; }
  .p-normal { color: var(--orange); background: #2a1608; }
  .p-caro   { color: var(--yellow); background: #262000; }
  .p-nd     { color: var(--dim); background: #1e1e1e; }
  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; padding-top: 8px; border-top: 1px solid var(--border); }
  .people { font-size: 11.5px; color: var(--dim); }
  .tickets { font-size: 12.5px; font-weight: 700; color: var(--orange); text-decoration: none; }
  .tickets:hover { color: #ff8a52; }
  .empty { color: var(--muted); font-size: 15px; padding: 40px 0; }

  /* MINI CALENDARIO */
  .group-cuando { position: relative; }
  .mini-cal { display: none; position: absolute; left: 0; top: 100%; margin-top: 8px; width: 310px; z-index: 20; background: var(--card); border: 1px solid var(--border2); border-radius: 12px; padding: 10px 12px 12px; box-shadow: 0 16px 40px rgba(0,0,0,.6); }
  .mc-ok { margin-top: 8px; width: 100%; background: var(--orange); color: #fff; border: none; border-radius: 8px; padding: 8px; font: 700 13px 'Space Grotesk', sans-serif; cursor: pointer; }
  .mc-ok:disabled { opacity: .35; cursor: default; }
  .mini-cal.open { display: block; }
  .mc-top { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 700; margin-bottom: 6px; text-transform: capitalize; }
  .mc-top button { background: none; border: 1px solid var(--border2); color: var(--muted); border-radius: 6px; width: 26px; height: 26px; cursor: pointer; }
  .mc-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px 0; text-align: center; }
  .mc-dow { font-size: 10px; color: var(--dim); padding: 3px 0; }
  .mc-d { background: none; border: none; color: var(--text); font: 500 12.5px 'Space Grotesk', sans-serif; height: 30px; border-radius: 7px; cursor: pointer; }
  .mc-d:hover:not(:disabled) { background: var(--border); }
  .mc-d:disabled { color: #3a3a3a; cursor: default; }
  .mc-d.today { box-shadow: inset 0 0 0 1px var(--muted); }
  .mc-d.in { background: #3a1a08; border-radius: 0; color: #f0c090; }
  .mc-d.sel { background: var(--orange); color: #fff; font-weight: 700; }
  .mc-note { font-size: 11.5px; color: var(--dim); margin-top: 6px; }

  /* ATAJOS */
  .hello h2 { font-size: 30px; font-weight: 800; letter-spacing: -1.2px; }
  .hello h2 span { color: var(--orange); }
  .hello p { color: var(--muted); margin: 6px 0 22px; font-size: 15px; }
  .shortcuts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 760px; }
  .sc {
    background: var(--card); border: 1px solid var(--border2); border-radius: 12px; padding: 16px;
    text-align: left; color: var(--text); font-size: 14.5px; font-weight: 600; cursor: pointer;
    display: flex; flex-direction: column; gap: 8px; transition: all .12s;
  }
  .sc:hover { border-color: var(--orange); transform: translateY(-2px); }
  .sc i { font-style: normal; font-size: 22px; }
  .sc small { color: var(--dim); font-weight: 400; font-size: 12px; }
  .back { background: none; border: none; color: var(--muted); font-size: 13px; cursor: pointer; margin-bottom: 14px; padding: 0; }
  .back:hover { color: var(--text); }

  /* CHAT ABAJO */
  .chat-dock { border-top: 1px solid var(--border); background: var(--bg); flex-shrink: 0; }
  .chat-thread { max-height: 0; overflow-y: auto; transition: max-height .25s ease; display: flex; flex-direction: column; gap: 10px; padding: 0 28px; }
  .chat-dock.open .chat-thread { max-height: 300px; padding: 16px 28px 4px; }
  .msg { max-width: 75%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.45; }
  .msg.bot { background: var(--card); border: 1px solid var(--border); border-bottom-left-radius: 3px; align-self: flex-start; }
  .msg.me  { background: #1e0e05; border: 1px solid #4a2010; color: #f0c090; border-bottom-right-radius: 3px; align-self: flex-end; }
  .chat-bar { display: flex; gap: 10px; align-items: center; padding: 14px 28px 18px; }
  .chat-bar .bot-ico { width: 40px; height: 40px; border-radius: 50%; background: var(--orange); display: flex; align-items: center; justify-content: center; font-size: 19px; flex-shrink: 0; }
  .chat-bar input {
    flex: 1; background: var(--surface); border: 1px solid var(--border2); color: var(--text);
    border-radius: 24px; padding: 13px 18px; font: 15px 'Space Grotesk', sans-serif; outline: none;
  }
  .chat-bar input:focus { border-color: var(--orange); }
  .chat-bar button { width: 46px; height: 46px; border-radius: 50%; border: none; background: var(--orange); color: #fff; font-size: 18px; cursor: pointer; flex-shrink: 0; }
  .chat-toggle { background: none; border: none; color: var(--dim); font-size: 12px; cursor: pointer; }

  /* MOBILE */
  .filters-toggle { display: none; }
  @media (max-width: 820px) {
    header { padding: 12px 16px; }
    .mock-tag { display: none; }
    .app { grid-template-columns: 1fr; overflow-y: auto; }
    .side { border-right: none; border-bottom: 1px solid var(--border); padding: 16px; gap: 14px; overflow: visible; }
    .side .group, .side .search { display: none; }
    .side.open .group, .side.open .search { display: block; }
    .side.open .search { display: block; width: 100%; }
    .filters-toggle {
      display: flex; justify-content: space-between; align-items: center; background: var(--surface);
      border: 1px solid var(--border2); color: var(--text); border-radius: 12px; padding: 12px 14px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .filters-toggle em { font-style: normal; color: var(--orange); font-weight: 500; font-size: 13px; }
    .ask { margin-top: 0; border-top: none; padding-top: 0; }
    .ask label { display: none; }
    .main { overflow: visible; padding: 18px 16px 40px; }
    .grid { grid-template-columns: 1fr; }
    .chat-bar, .chat-dock.open .chat-thread { padding-left: 16px; padding-right: 16px; }
    .main-wrap { min-height: auto; }
    .chat-dock { position: sticky; bottom: 0; }
    .shortcuts { grid-template-columns: 1fr 1fr; }
    .hello h2 { font-size: 24px; }
    .res-head h2 { font-size: 20px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">Let's <span>Part</span>IA<small>Many events · Your event</small></div>
  <nav class="tabs">
    <button class="tab on">🪩 Fiestas y clubs</button>
    <button class="tab">🎤 Conciertos<sup>pronto</sup></button>
    <button class="tab">🎭 Teatro y shows<sup>pronto</sup></button>
    <button class="tab">⚽ Deportes<sup>pronto</sup></button>
  </nav>
  <div class="top-right">
    <button class="saved">❤️ Guardados</button>
    <div class="powered">powered by <b>stepwise</b></div>
  </div>
</header>

<div class="app">
  <aside class="side" id="side">
    <div>
    <label class="city-label" for="city">Ciudad</label>
    <div class="city">
      <select id="city">
        <option>Barcelona</option><option>Madrid</option><option>Berlin</option><option>London</option>
        <option>Amsterdam</option><option>Paris</option><option>Ibiza</option><option>Buenos Aires</option>
        <option selected>Rio de Janeiro</option><option>New York</option>
      </select>
    </div>
    </div>

    <button class="filters-toggle" id="ftoggle" onclick="document.getElementById('side').classList.toggle('open')">
      <span>Filtros</span><em id="fsummary"></em>
    </button>

    <div class="group group-cuando">
      <h4>Cuándo</h4>
      <div class="chips" data-g="cuando">
        <button class="chip" data-v="hoy">Hoy</button>
        <button class="chip" data-v="manana">Mañana</button>
        <button class="chip on" data-v="finde">Este finde</button>
        <button class="chip" data-v="cal" id="chip-cal">📅 Elegir fechas</button>
      </div>
      <div class="mini-cal" id="minical"></div>
    </div>
    <div class="group">
      <h4>Franja <em>· horario de inicio entre</em></h4>
      <div class="chips" data-g="franja">
        <button class="chip" data-v="tarde">Tarde<small>14–20hs</small></button>
        <button class="chip" data-v="sunset">Sunset<small>18–21hs</small></button>
        <button class="chip" data-v="noche">Noche<small>21–03hs</small></button>
        <button class="chip" data-v="afters">Afters<small>05–09hs</small></button>
      </div>
    </div>
    <div class="group">
      <h4>Precio</h4>
      <div class="chips" data-g="precio">
        <button class="chip" data-v="gratis">Gratis</button>
        <button class="chip" data-v="bajo">Bajo<small id="p-bajo"></small></button>
        <button class="chip" data-v="medio">Medio<small id="p-medio"></small></button>
        <button class="chip" data-v="alto">Alto<small id="p-alto"></small></button>
      </div>
    </div>
    <div class="group">
      <h4>Género</h4>
      <div class="chips" data-g="genero">
        <button class="chip" data-v="Techno">Techno</button>
        <button class="chip" data-v="House">House</button>
        <button class="chip" data-v="Progressive House">Progressive</button>
        <button class="chip" data-v="Disco">Disco</button>
        <button class="chip" data-v="Dub">Dub</button>
      </div>
    </div>

    <button class="search" onclick="buscar()">Buscar planes</button>

  </aside>

  <div class="main-wrap">
    <main class="main" id="main"></main>
    <div class="chat-dock" id="dock">
      <div class="chat-thread" id="thread"></div>
      <div class="chat-bar">
        <div class="bot-ico">🤖</div>
        <input id="ask" placeholder="¡Hey! Decime acá qué te gustaría y encuentro algo para vos ✨" onkeydown="if(event.key==='Enter')preguntar()">
        <button onclick="preguntar()">↑</button>
      </div>
    </div>
  </div>
</div>

<script>
// Datos de ejemplo (eventos reales de RA en Rio, 17/10/2026)
const EVENTOS = [
  { titulo: 'Noites de Dub recebe Confronto Soundsystem e TRAJANO', fecha: '2026-10-17', hora: '22:00', fin: '05:00', venue: 'TRAUMA', artistas: ['Capetini', 'TRAJANO'], generos: ['House', 'Dub'], cat: 'barato', precio: 'R$50', gente: 26 },
  { titulo: 'Raw Pulse 002', fecha: '2026-10-17', hora: '21:00', fin: '08:00', venue: 'Sacadura Cabral, 167', artistas: [], generos: ['Progressive House', 'Techno'], cat: 'barato', precio: 'R$25', gente: 2 },
  { titulo: 'CUSCUZ 17/10 NA RUA', fecha: '2026-10-17', hora: '18:00', fin: '04:00', venue: 'TBA - Secret', artistas: ['Bernardo Campos'], generos: ['House', 'Disco'], cat: 'gratis', precio: '', gente: 0 },
  { titulo: 'D-Edge Rio apresenta D-HOUSERS', fecha: '2026-10-17', hora: '23:00', fin: '07:00', venue: 'D-Edge RIO', artistas: [], generos: [], cat: 'nd', precio: '', gente: 0 },
  { titulo: 'Domingo de Sol — Open Air', fecha: '2026-10-18', hora: '15:00', fin: '22:00', venue: 'Pier Mauá', artistas: ['Selector X', 'Luna B'], generos: ['House', 'Disco'], cat: 'normal', precio: 'R$120', gente: 48 },
];

// Moneda por ciudad: símbolo y cotización aprox a euros (umbrales: bajo < 15€, medio 15–30€, alto > 30€)
const MONEDA = {
  'Barcelona': ['€', 1], 'Madrid': ['€', 1], 'Berlin': ['€', 1], 'Amsterdam': ['€', 1], 'Paris': ['€', 1], 'Ibiza': ['€', 1],
  'London': ['£', 1.17], 'Buenos Aires': ['AR$', 0.0008], 'Rio de Janeiro': ['R$', 0.17], 'New York': ['US$', 0.92],
};
function redondo(n) { const p = n < 100 ? 5 : n < 1000 ? 10 : Math.pow(10, String(Math.round(n)).length - 2); return Math.round(n / p) * p; }
function preciosCiudad() {
  const [sym, rate] = MONEDA[document.getElementById('city').value] || ['€', 1];
  const f = n => sym + redondo(n / rate).toLocaleString('es');
  document.getElementById('p-bajo').textContent  = `hasta ${f(15)}`;
  document.getElementById('p-medio').textContent = `${f(15)}–${f(30)}`;
  document.getElementById('p-alto').textContent  = `desde ${f(30)}`;
}

const DIAS = ['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'];
const MESES = ['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
const DIAS_LARGO = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const sel = { cuando: 'finde', franja: null, precio: null, genero: null };

document.querySelectorAll('.chips').forEach(g => {
  g.addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    const k = g.dataset.g, v = b.dataset.v;
    if (v === 'cal') { cal.abierto = !cal.abierto; sel.cuando = 'cal'; pintarCal(); pintar(); return; }
    if (k === 'cuando') { cal.abierto = false; pintarCal(); }
    sel[k] = sel[k] === v && k !== 'cuando' ? null : v;
    pintar();
  });
});

// Mini calendario (fechas ancladas a la maqueta: hoy = jue 8 oct 2026)
const HOY = new Date(2026, 9, 8);
const cal = { abierto: false, a: null, b: null, mes: new Date(2026, 9, 1) };
const MESES_L = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function pintarCal() {
  const el = document.getElementById('minical');
  el.classList.toggle('open', cal.abierto);
  if (!cal.abierto) return;
  const y = cal.mes.getFullYear(), m = cal.mes.getMonth();
  const off = (new Date(y, m, 1).getDay() + 6) % 7, n = new Date(y, m + 1, 0).getDate();
  let g = ['L','M','X','J','V','S','D'].map(d => `<div class="mc-dow">${d}</div>`).join('') + '<div></div>'.repeat(off);
  for (let i = 1; i <= n; i++) {
    const d = new Date(y, m, i), t = d.getTime(), c = ['mc-d'];
    if (t === HOY.getTime()) c.push('today');
    if ((cal.a && t === cal.a.getTime()) || (cal.b && t === cal.b.getTime())) c.push('sel');
    else if (cal.a && cal.b && t > cal.a && t < cal.b) c.push('in');
    g += `<button class="${c.join(' ')}" ${d < HOY ? 'disabled' : ''} onclick="elegirDia(${y},${m},${i})">${i}</button>`;
  }
  el.innerHTML = `<div class="mc-top"><button onclick="cal.mes=new Date(${y},${m - 1},1);pintarCal()">‹</button>${MESES_L[m]} ${y}<button onclick="cal.mes=new Date(${y},${m + 1},1);pintarCal()">›</button></div>
    <div class="mc-grid">${g}</div><div class="mc-note">${cal.a && !cal.b ? 'Tocá otro día para elegir un rango' : 'Tocá un día, o dos para un rango (hasta 7 días)'}</div>
    <button class="mc-ok" ${cal.a ? '' : 'disabled'} onclick="cal.abierto=false;pintarCal()">Listo</button>`;
}
function elegirDia(y, m, i) {
  const d = new Date(y, m, i);
  if (!cal.a || cal.b) { cal.a = d; cal.b = null; }
  else if (d < cal.a) cal.a = d;
  else if (d.getTime() !== cal.a.getTime()) cal.b = (d - cal.a) / 864e5 > 6 ? new Date(cal.a.getTime() + 6 * 864e5) : d;
  if (cal.b) setTimeout(() => { cal.abierto = false; pintarCal(); }, 350);
  pintarCal(); pintar();
}
function textoFechas() {
  if (!cal.a) return '📅 Elegir fechas';
  const f = d => `${d.getDate()} ${MESES[d.getMonth()].toLowerCase()}`;
  return cal.b ? `📅 ${f(cal.a)} → ${f(cal.b)}` : `📅 ${['dom','lun','mar','mié','jue','vie','sáb'][cal.a.getDay()]} ${f(cal.a)}`;
}

function pintar() {
  document.getElementById('chip-cal').textContent = textoFechas();
  document.querySelectorAll('.chips').forEach(g => {
    g.querySelectorAll('.chip').forEach(b => b.classList.toggle('on', sel[g.dataset.g] === b.dataset.v));
  });
  const etiquetas = { hoy: 'Hoy', manana: 'Mañana', finde: 'Este finde', cal: textoFechas().replace('📅 ', '') };
  const partes = [etiquetas[sel.cuando], sel.franja, sel.precio, sel.genero].filter(Boolean);
  document.getElementById('fsummary').textContent = partes.join(' · ');
}

function enFranja(h, f) {
  if (!f) return true;
  const r = { tarde: ['14:00','20:00'], sunset: ['18:00','21:00'], noche: ['21:00','03:00'], afters: ['05:00','09:00'] }[f];
  return r[0] <= r[1] ? (h >= r[0] && h <= r[1]) : (h >= r[0] || h <= r[1]);
}

function buscar() {
  const ciudad = document.getElementById('city').value;
  const lista = EVENTOS.filter(e =>
    enFranja(e.hora, sel.franja) &&
    (!sel.precio || ({ gratis: ['gratis'], bajo: ['gratis','barato'], medio: ['normal'], alto: ['caro'] }[sel.precio] || []).includes(e.cat)) &&
    (!sel.genero || e.generos.includes(sel.genero))
  );
  const main = document.getElementById('main');
  const activos = [sel.franja, sel.precio, sel.genero].filter(Boolean).map(x => `<span>${x}</span>`).join('');
  let html = `
    <div class="res-head">
      <h2>${lista.length ? `${lista.length} ${lista.length === 1 ? 'plan' : 'planes'} en <span>${ciudad}</span>` : `Nada por acá en <span>${ciudad}</span>`}</h2>
      <div class="active">${activos}</div>
    </div>
    <div class="res-sub">${lista.length ? 'Ordenados por día y por cuánta gente va.' : 'Probá sacando algún filtro 👈'}</div>`;
  let dia = null;
  lista.forEach((e, i) => {
    if (e.fecha !== dia) {
      if (dia) html += '</div>';
      dia = e.fecha;
      const d = new Date(e.fecha + 'T12:00:00');
      html += `<div class="day">${DIAS_LARGO[d.getDay()]} ${d.getDate()}</div><div class="grid">`;
    }
    html += tarjeta(e);
  });
  if (dia) html += '</div>';
  main.innerHTML = '<button class="back" onclick="inicio()">← Volver a los atajos</button>' + html;
  document.getElementById('side').classList.remove('open');
}

function tarjeta(e) {
  const d = new Date(e.fecha + 'T12:00:00');
  const precio = { gratis: 'GRATIS', nd: 'VER PRECIO' }[e.cat] || `${e.cat.toUpperCase()} · ${e.precio}`;
  return `
    <article class="card">
      <div class="date"><div class="dw">${DIAS[d.getDay()]}</div><div class="dn">${d.getDate()}</div><div class="dm">${MESES[d.getMonth()]}</div></div>
      <div class="body">
        <div class="town">📍 ${document.getElementById('city').value}</div>
        <div class="title">${e.titulo}</div>
        <div class="where"><b>${e.venue}</b> · ${e.hora} → ${e.fin}</div>
        ${e.artistas.length ? `<div class="who">${e.artistas.join(', ')}</div>` : ''}
        <div class="tags">
          ${e.generos.map(g => `<span class="tag">${g}</span>`).join('')}
          <span class="price p-${e.cat}">${precio}</span>
        </div>
        <div class="foot">
          <span class="people">${e.gente ? `${e.gente} interesados` : 'Nuevo en RA'}</span>
          <a class="tickets" href="#" onclick="return false">Entradas →</a>
        </div>
      </div>
    </article>`;
}

function inicio() {
  const ciudad = document.getElementById('city').value;
  document.getElementById('main').innerHTML = `
    <div class="hello">
      <h2>¿Qué hacemos en <span>${ciudad}</span>?</h2>
      <p>Elegí un atajo, armá tu búsqueda con los filtros o decime qué querés abajo 👇</p>
      <div class="shortcuts">
        <button class="sc" onclick="atajo('finde')"><i>🗓️</i>Lo mejor de este finde<small>Lo que más gente convoca</small></button>
        <button class="sc" onclick="atajo('top')"><i>🔥</i>Lo más top hoy<small>Lo que está pegando hoy</small></button>
        <button class="sc" onclick="atajo('gratis')"><i>💸</i>Gratis o barato<small>Para salir sin gastar</small></button>
        <button class="sc" onclick="atajo('sunset')"><i>🌅</i>Sunset y open air<small>Arrancan al caer el sol</small></button>
        <button class="sc" onclick="atajo('club')"><i>🪩</i>Buscar por club<small>Qué hay en tu disco favorita</small></button>
        <button class="sc" onclick="atajo('dj')"><i>🎧</i>Fechas de un DJ<small>Cuándo toca tu artista</small></button>
      </div>
    </div>`;
}

function atajo(k) {
  if (k === 'club') return bot('¿De qué club o disco querés ver la agenda?');
  if (k === 'dj')   return bot('¿Qué DJ o artista querés seguir?');
  Object.assign(sel, { cuando: 'finde', franja: null, precio: null, genero: null });
  if (k === 'top')    sel.cuando = 'hoy';
  if (k === 'gratis') sel.precio = 'barato';
  if (k === 'sunset') sel.franja = 'sunset';
  pintar(); buscar();
}

function burbuja(txt, quien) {
  const t = document.getElementById('thread');
  const m = document.createElement('div');
  m.className = 'msg ' + quien; m.textContent = txt;
  t.appendChild(m); t.scrollTop = t.scrollHeight;
  document.getElementById('dock').classList.add('open');
}
function bot(txt) { burbuja(txt, 'bot'); document.getElementById('ask').focus(); }

function preguntar() {
  const inp = document.getElementById('ask');
  const t = inp.value.toLowerCase();
  if (!t.trim()) return;
  burbuja(inp.value, 'me'); inp.value = '';
  if (t.includes('techno')) sel.genero = 'Techno';
  if (t.includes('house')) sel.genero = 'House';
  if (t.includes('noche')) sel.franja = 'noche';
  if (t.includes('tarde')) sel.franja = 'tarde';
  if (t.includes('gratis')) sel.precio = 'gratis';
  if (t.includes('barato')) sel.precio = 'barato';
  if (t.includes('hoy')) sel.cuando = 'hoy';
  if (t.includes('finde') || t.includes('sábado') || t.includes('sabado')) sel.cuando = 'finde';
  pintar();
  setTimeout(() => {
    bot('¡Listo! Te marqué los filtros a la izquierda y busqué 🔎 Si algo no es lo que querías, tocalo y cambialo.');
    buscar();
  }, 400);
}

document.getElementById('city').addEventListener('change', () => { preciosCiudad(); inicio(); });
preciosCiudad();
pintar();
inicio();
</script>
</body>
</html>
