name: Actualizar restaurantes (OpenStreetMap)

on:
  schedule:
    - cron: "41 5 * * 1"   # todos los lunes a las 05:41 UTC (después de los bares)
  workflow_dispatch: {}
  push:
    paths:
      - "tools/bajar_restaurantes.py"
      - ".github/workflows/restaurantes.yml"

permissions:
  contents: write

concurrency:
  group: datos-osm
  cancel-in-progress: false

jobs:
  restaurantes:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python tools/bajar_restaurantes.py
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/restaurantes
          git diff --cached --quiet || git commit -m "Actualizar restaurantes de OpenStreetMap"
          git pull --rebase origin main
          git push
