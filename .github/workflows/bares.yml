name: Actualizar bares (OpenStreetMap)

on:
  schedule:
    - cron: "17 1 * * 4"   # jueves 01:17 UTC = miércoles a la noche, ~3:17 en España
  workflow_dispatch: {}      # botón "Run workflow" en la pestaña Actions
  push:
    paths:
      - "tools/bajar_bares.py"
      - ".github/workflows/bares.yml"

permissions:
  contents: write

jobs:
  bares:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python tools/bajar_bares.py
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/bares
          git diff --cached --quiet || git commit -m "Actualizar bares de OpenStreetMap"
          git pull --rebase origin main
          git push
