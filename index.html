<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Let's PartIA · by Stepwise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #0a0a0a;
    --surface: #111111;
    --card:    #181818;
    --border:  #2a2a2a;
    --border2: #383838;
    --orange:  #E9682E;
    --orange2: #c94f18;
    --neon:    #39FF14;
    --yellow:  #FFE600;
    --text:    #F5F5F5;
    --muted:   #aaaaaa;
    --dim:     #666666;
  }

  body {
    font-family: 'Space Grotesk', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
  }

  /* HEADER */
  header {
    width: 100%;
    padding: 14px 24px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .logo-mark {
    width: 36px; height: 36px;
    background: var(--orange); border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
  }
  .logo-mark svg { width: 19px; height: 19px; }
  .app-name { font-size: 18px; font-weight: 800; letter-spacing: -0.6px; }
  .app-name span { color: var(--orange); }
  .app-sub { font-size: 11px; color: var(--dim); margin-top: 1px; }
  .powered { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--dim); }
  .stepwise-logo { font-size: 12px; font-weight: 700; color: var(--orange); }

  /* CHAT */
  .chat { width: 100%; max-width: 1080px; flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  #msgs {
    flex: 1; overflow-y: auto;
    padding: 24px 22px 10px;
    display: flex; flex-direction: column; gap: 16px;
    scrollbar-width: thin; scrollbar-color: var(--border) transparent;
  }

  /* BIENVENIDA */
  .welcome {
    display: flex; flex-direction: column;
    gap: 22px; animation: fadein .3s ease;
    min-height: 100%; max-width: 820px; width: 100%; margin: 0 auto;
  }

  .welcome-title {
    font-size: clamp(36px, 7vw, 58px);
    font-weight: 800;
    letter-spacing: -2px;
    line-height: 1.05;
    color: var(--text);
  }
  .welcome-title .part { color: var(--orange); }

  .welcome-sub {
    font-size: 16px; color: var(--muted);
    font-weight: 400; letter-spacing: -0.2px;
    line-height: 1.5;
    max-width: 500px;
  }

  .welcome-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    width: 100%;
  }

  .welcome-btn {
    background: var(--card);
    border: 1px solid var(--border2);
    color: var(--text);
    padding: 16px 14px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    text-align: left;
    display: flex; flex-direction: column; gap: 8px;
    transition: all .15s;
    letter-spacing: -0.2px;
    line-height: 1.3;
  }
  .welcome-btn .icon { font-size: 22px; }
  .welcome-btn:hover { border-color: var(--orange); background: #1e1208; transform: translateY(-2px); }
  .welcome-btn:nth-child(2):hover { border-color: var(--neon); background: #081808; }
  .welcome-btn:nth-child(3):hover { border-color: var(--yellow); background: #181400; }
  .welcome-btn:nth-child(5):hover { border-color: var(--yellow); background: #181400; }
  .welcome-btn:nth-child(6):hover { border-color: var(--orange); background: #1e1208; }
  .welcome-btn:nth-child(7):hover { border-color: var(--neon); background: #081808; }
  .welcome-btn:nth-child(8):hover { border-color: var(--yellow); background: #181400; }
  .welcome-btn:nth-child(9):hover { border-color: var(--orange); background: #1e1208; }
  .welcome-btn:nth-child(4):hover { border-color: var(--neon); background: #081808; }

  .ver-mas-btn {
    background: transparent;
    border: 1px dashed var(--border2);
    color: var(--dim);
    padding: 16px 14px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    text-align: center;
    transition: all .15s;
    letter-spacing: -0.1px;
  }
  .ver-mas-btn:hover { border-color: var(--muted); color: var(--muted); }

  /* Opciones extra ocultas */
  .extra-opts { display: none; grid-template-columns: repeat(3,1fr); gap: 10px; }
  .extra-opts.visible { display: grid; animation: fadein .2s ease; }

  .welcome-hint {
    margin-top: auto; padding-top: 10px;
    font-size: clamp(18px, 2.6vw, 22px); font-weight: 600; letter-spacing: -0.4px;
    color: var(--text); display: flex; flex-direction: column; align-items: center; gap: 6px;
    text-align: center;
  }
  .welcome-hint .arrow { color: var(--orange); font-size: 22px; animation: nudge 1.6s ease-in-out infinite; }
  @keyframes nudge { 0%,100%{transform:translateY(0)} 50%{transform:translateY(5px)} }

  /* MENSAJES */
  .msg { display: flex; flex-direction: column; gap: 6px; animation: fadein .2s ease; }
  .msg.bot  { align-items: flex-start; }
  .msg.user { align-items: flex-end; }

  .bubble {
    max-width: 84%; padding: 13px 17px; border-radius: 14px;
    font-size: 15px; line-height: 1.6; white-space: pre-wrap;
    word-break: break-word; letter-spacing: -0.1px;
  }
  .bot .bubble {
    background: var(--card); border: 1px solid var(--border);
    border-bottom-left-radius: 3px; color: var(--text);
  }
  .user .bubble {
    background: #1e0e05; border: 1px solid #4a2010;
    border-bottom-right-radius: 3px; color: #f0c090; font-weight: 500;
  }

  /* OPCIONES */
  .opts { display: flex; flex-wrap: wrap; gap: 8px; max-width: 84%; }
  .opt {
    background: transparent; border: 1px solid var(--border2);
    color: var(--muted); padding: 7px 15px; border-radius: 20px;
    font-size: 14px; font-weight: 500; cursor: pointer;
    font-family: inherit; transition: all .15s;
  }
  .opt:hover { background: var(--orange); border-color: var(--orange); color: #fff; }

  .time { font-size: 11px; color: var(--dim); padding: 0 4px; }

  /* EVENTO CARD */
  .ev-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 15px 17px; margin-top: 10px;
    display: flex; flex-direction: column; gap: 8px; width: 100%;
    transition: border-color .15s;
  }
  .ev-card:hover { border-color: var(--orange); }

  .ev-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .ev-title { font-weight: 700; font-size: 15px; color: var(--text); flex: 1; line-height: 1.3; letter-spacing: -0.3px; }

  .ev-badge {
    font-size: 11px; font-weight: 700; padding: 4px 10px;
    border-radius: 20px; white-space: nowrap; flex-shrink: 0;
    letter-spacing: 0.4px; text-transform: uppercase;
  }
  .badge-gratis { background: #002a10; color: var(--neon);   border: 1px solid #005020; }
  .badge-barato { background: #0a2010; color: #90e060;        border: 1px solid #1a4020; }
  .badge-normal { background: #1e0e00; color: var(--orange);  border: 1px solid #3a2010; }
  .badge-caro   { background: #1e1200; color: var(--yellow);  border: 1px solid #3a3000; }
  .badge-nd     { background: var(--card); color: var(--dim); border: 1px solid var(--border); }

  .ev-artists { font-size: 13.5px; color: var(--muted); font-weight: 500; }

  .ev-meta {
    font-size: 13px; color: var(--dim);
    display: flex; gap: 14px; flex-wrap: wrap; align-items: center;
  }
  .ev-date  { font-weight: 700; color: var(--yellow); letter-spacing: 0.2px; }
  .ev-hora  { font-weight: 600; color: var(--muted); }

  .ev-destacado {
    font-size: 13px; color: var(--muted); font-style: italic;
    line-height: 1.5; border-left: 2px solid var(--orange);
    padding-left: 10px; opacity: .8;
  }

  .ev-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 2px; }
  .ev-asistentes { font-size: 12px; color: var(--dim); }
  .ev-link {
    font-size: 12px; font-weight: 700; color: var(--orange);
    text-decoration: none; letter-spacing: 0.5px; text-transform: uppercase;
  }
  .ev-link:hover { color: var(--orange2); }

  /* TYPING */
  .typing { display: flex; gap: 5px; align-items: center; padding: 4px 0; }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%; background: var(--dim);
    animation: bounce .9s infinite;
  }
  .typing span:nth-child(2) { animation-delay: .15s; }
  .typing span:nth-child(3) { animation-delay: .3s; }

  @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-5px)} }
  @keyframes fadein { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

  /* INPUT */
  .input-area {
    padding: 14px 22px 22px; border-top: 1px solid var(--border);
    background: var(--bg); display: flex; gap: 10px; align-items: center;
    width: 100%; max-width: 1080px; flex-shrink: 0;
  }
  #inp {
    flex: 1; background: var(--surface); border: 1px solid var(--border);
    color: var(--text); padding: 13px 17px; border-radius: 10px;
    font-size: 15px; font-family: inherit; outline: none;
    transition: border-color .15s; letter-spacing: -0.1px;
  }
  #inp:focus { border-color: var(--orange); }
  #inp::placeholder { color: var(--dim); }

  #sendbtn {
    width: 48px; height: 48px; border-radius: 10px; border: none;
    background: var(--orange); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: background .15s;
  }
  #sendbtn:hover { background: var(--orange2); }
  #sendbtn:disabled { opacity: .4; cursor: default; }

  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

  /* RESULTADOS */
  .bubble.has-events { max-width: 100%; width: 100%; }
  .ev-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 10px; white-space: normal; }
  .ev-grid .ev-card { margin-top: 0; }
  @media (min-width: 860px) { .ev-grid { grid-template-columns: 1fr 1fr; } }

  /* DÍAS EN RESULTADOS */
  .day-header {
    grid-column: 1 / -1; margin-top: 8px; font-size: 13px; font-weight: 700; color: var(--yellow);
    letter-spacing: 0.4px; text-transform: uppercase;
    border-bottom: 1px solid var(--border); padding-bottom: 6px;
  }
  .day-header:first-child { margin-top: 4px; }

  /* CALENDARIO */
  #calbtn {
    width: 52px; height: 52px; border-radius: 10px; flex-shrink: 0; padding: 0; overflow: hidden;
    background: transparent; border: 1.5px solid #e8e8e8; cursor: pointer;
    display: flex; flex-direction: column; transition: transform .15s, border-color .15s;
    font-family: inherit; color: #e8e8e8;
  }
  #calbtn:hover { transform: translateY(-2px); border-color: #fff; color: #fff; }
  #calbtn .cal-dow-top {
    border-bottom: 1.5px solid currentColor; font-size: 10px; font-weight: 700;
    letter-spacing: 1.2px; padding: 3px 0 2px; width: 100%; text-align: center;
  }
  #calbtn .cal-num {
    flex: 1; display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700; letter-spacing: -1px; line-height: 1;
  }
  .opt.opt-cal { border-color: var(--orange); color: var(--orange); }
  .opt.opt-cal:hover { color: #fff; }

  .cal {
    background: var(--card); border: 1px solid var(--border2); border-radius: 14px;
    border-bottom-left-radius: 3px; padding: 14px; width: 100%; max-width: 340px;
    display: flex; flex-direction: column; gap: 10px; user-select: none;
  }
  .cal-top { display: flex; align-items: center; justify-content: space-between; }
  .cal-title { font-weight: 700; font-size: 15px; letter-spacing: -0.3px; text-transform: capitalize; }
  .cal-nav {
    background: transparent; border: 1px solid var(--border2); color: var(--muted);
    width: 32px; height: 32px; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 16px;
  }
  .cal-nav:hover:not(:disabled) { border-color: var(--orange); color: var(--orange); }
  .cal-nav:disabled { opacity: .25; cursor: default; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px 0; }
  .cal-dow { font-size: 11px; color: var(--dim); text-align: center; padding: 4px 0; font-weight: 600; }
  .cal-day {
    aspect-ratio: 1; border: none; background: transparent; color: var(--text);
    font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer;
    border-radius: 8px; position: relative;
  }
  .cal-day:hover:not(:disabled) { background: var(--border); }
  .cal-day:disabled { color: #333; cursor: default; }
  .cal-day.today { box-shadow: inset 0 0 0 1px var(--neon); color: var(--neon); }
  .cal-day.in-range { background: #3a1a08; border-radius: 0; color: #f0c090; }
  .cal-day.sel { background: var(--orange); color: #fff; font-weight: 700; }
  .cal-day.sel.start.has-end { border-radius: 8px 0 0 8px; }
  .cal-day.sel.end { border-radius: 0 8px 8px 0; }
  .cal-quick { display: flex; flex-wrap: wrap; gap: 6px; }
  .cal-quick .opt { padding: 5px 11px; font-size: 13px; }
  .cal-note { font-size: 12px; color: var(--dim); min-height: 16px; }
  .cal-actions { display: flex; gap: 8px; }
  .cal-ok {
    flex: 1; background: var(--orange); color: #fff; border: none; border-radius: 10px;
    padding: 11px; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .cal-ok:disabled { opacity: .35; cursor: default; }
  .cal-cancel {
    background: transparent; border: 1px solid var(--border2); color: var(--muted);
    border-radius: 10px; padding: 11px 14px; font-family: inherit; font-size: 14px; cursor: pointer;
  }

  @media (max-width: 520px) {
    .welcome { gap: 16px; }
    .welcome-grid { grid-template-columns: repeat(3,1fr); gap: 8px; }
    .welcome-btn { padding: 12px 9px; font-size: 12.5px; gap: 6px; }
    .welcome-btn .icon { font-size: 20px; }
    .welcome-sub { font-size: 14px; }
    #inp { font-size: 14px; padding: 13px 12px; }
    .welcome-title { font-size: 36px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18V5l12-2v13"/>
        <circle cx="6" cy="18" r="3"/>
        <circle cx="18" cy="16" r="3"/>
      </svg>
    </div>
    <div>
      <div class="app-name">Let's <span>Part</span>IA</div>
      <div class="app-sub">Many events · Your event</div>
    </div>
  </div>
  <div class="powered">
    <span>powered by</span>
    <div class="stepwise-logo">stepwise</div>
  </div>
</header>

<div class="chat">
  <div id="msgs"></div>
  <div class="input-area">
    <button id="calbtn" onclick="openCalendar()" aria-label="Elegir fechas" title="Elegir fechas">
      <span class="cal-dow-top" id="calbtn-dow">SAT</span>
      <span class="cal-num" id="calbtn-num">10</span>
    </button>
    <input id="inp" placeholder="...o contame qué tenés en mente y armamos tu plan 🎯" type="text">
    <button id="sendbtn" onclick="send()" aria-label="Enviar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script>
const RAILWAY = "https://bot-planes-production.up.railway.app";
let history = [];
let busy = false;

const DIAS  = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const MESES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

function now() { return new Date().toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' }); }

function formatFecha(fechaStr) {
  if (!fechaStr) return '';
  const d = new Date(fechaStr + 'T12:00:00');
  return `${DIAS[d.getDay()]} ${d.getDate()} ${MESES[d.getMonth()]}`;
}

function badgeInfo(ev) {
  // El backend ya manda categoría (en euros) + precio en moneda local: "Barato · R$50"
  const cat = ev.precio_cat || (ev.gratis ? 'gratis' : 'nd');
  const cls = { gratis: 'badge-gratis', barato: 'badge-barato', normal: 'badge-normal', caro: 'badge-caro' }[cat] || 'badge-nd';
  const txt = cat === 'nd' ? 'VER PRECIO' : (ev.precio_label || 'GRATIS').toUpperCase();
  return { cls, txt };
}

function initCalIcon() {
  const d = new Date();
  document.getElementById('calbtn-dow').textContent = ['SUN','MON','TUE','WED','THU','FRI','SAT'][d.getDay()];
  document.getElementById('calbtn-num').textContent = d.getDate();
}
initCalIcon();

// ── BIENVENIDA ─────────────────────────────────────────────────────────────
function showWelcome() {
  const msgs = document.getElementById('msgs');
  const welcome = document.createElement('div');
  welcome.className = 'welcome';
  welcome.id = 'welcome-screen';

  welcome.innerHTML = `
    <div>
      <div class="welcome-title">Let's <span class="part">Part</span>IA</div>
      <div class="welcome-sub" style="margin-top:12px">Tu asistente de planes para salir.<br>Eventos reales de Resident Advisor.</div>
    </div>

    <div class="welcome-grid">
      <button class="welcome-btn" onclick="quickSearch('planes-finde')"><span class="icon">🗓️</span>Planes este finde</button>
      <button class="welcome-btn" onclick="quickSearch('top-hoy')"><span class="icon">🔥</span>Lo más top hoy</button>
      <button class="welcome-btn" onclick="quickSearch('elegir-fecha')"><span class="icon">📅</span>Elegí tu fecha</button>
      <button class="welcome-btn" onclick="quickSearch('gratis-barato')"><span class="icon">💸</span>Gratis o barato</button>
      <button class="welcome-btn" onclick="quickSearch('tarde-dia')"><span class="icon">🌅</span>Algo de día / sunset</button>
      <button class="welcome-btn" onclick="quickSearch('por-genero')"><span class="icon">🎵</span>Por género musical</button>
      <button class="welcome-btn" onclick="quickSearch('buscar-dj')"><span class="icon">🎧</span>Fechas de un DJ</button>
      <button class="welcome-btn" onclick="quickSearch('buscar-disco')"><span class="icon">🪩</span>Ir a una disco</button>
      <button class="welcome-btn" onclick="quickSearch('festivales')"><span class="icon">🎪</span>Festivales</button>
    </div>

    <div class="welcome-hint">o simplemente escribí lo que tenés en mente<span class="arrow">↓</span></div>
  `;

  msgs.appendChild(welcome);
}

const QUICK_MESSAGES = {
  'planes-finde':     'Quiero planes para este finde',
  'gratis-barato':    'Busco algo gratis o barato este finde',
  'tarde-dia':        'Quiero algo de día o tarde, open air o sunset',
  'buscar-dj':        'Quiero buscar las próximas fechas de un DJ o artista',
  'buscar-disco':     'Quiero saber qué hay en una disco o venue en particular',
  'por-genero':       'Quiero buscar eventos por género musical',
  'top-hoy':          'Quiero ver lo más top de hoy',
  'festivales':       'Quiero ver festivales',
};

function quickSearch(tipo) {
  removeWelcome();
  if (tipo === 'elegir-fecha') { openCalendar(); return; }
  handleSend(QUICK_MESSAGES[tipo]);
}

function removeWelcome() {
  const w = document.getElementById('welcome-screen');
  if (w) w.remove();
}

// ── UI ─────────────────────────────────────────────────────────────────────
function addMsg(role, text, opts = [], events = []) {
  removeWelcome();
  const msgs = document.getElementById('msgs');
  const wrap = document.createElement('div');
  wrap.className = `msg ${role}`;
  const bub = document.createElement('div');
  bub.className = 'bubble';
  bub.textContent = (text || '').replace(/\*\*/g, '').replace(/^#+\s*/gm, '');
  if (events.length) bub.classList.add('has-events');
  const grid = document.createElement('div');
  grid.className = 'ev-grid';

  const multiDia = new Set(events.map(e => e.fecha)).size > 1;
  let diaActual = null;
  events.forEach(ev => {
    if (multiDia && ev.fecha !== diaActual) {
      diaActual = ev.fecha;
      const h = document.createElement('div');
      h.className = 'day-header';
      h.textContent = formatFecha(ev.fecha);
      grid.appendChild(h);
    }
    const card = document.createElement('div');
    card.className = 'ev-card';
    const artists = (ev.artistas||[]).slice(0,4).join(' · ') + ((ev.artistas||[]).length>4?` +${ev.artistas.length-4}`:'');
    const horaInicio = ev.hora && ev.hora !== '23:59' ? ev.hora : null;
    const horaFin    = ev.hora_fin && ev.hora_fin !== '23:59' ? ev.hora_fin : null;
    let horaStr = horaInicio && horaFin ? `${horaInicio} → ${horaFin}` : horaInicio ? `desde ${horaInicio}` : 'Noche';
    const { cls, txt } = badgeInfo(ev);
    const fecha = formatFecha(ev.fecha);

    card.innerHTML = `
      <div class="ev-header">
        <div class="ev-title">${ev.titulo}</div>
        <div class="ev-badge ${cls}">${txt}</div>
      </div>
      ${artists ? `<div class="ev-artists">👤 ${artists}</div>` : ''}
      <div class="ev-meta">
        ${fecha ? `<span class="ev-date">📅 ${fecha}</span>` : ''}
        <span class="ev-hora">🕐 ${horaStr}</span>
        ${ev.venue ? `<span>📍 ${ev.venue}</span>` : ''}
        ${ev.ciudad_venue ? `<span>🌆 ${ev.ciudad_venue}</span>` : ''}
        ${(ev.generos||[]).length ? `<span>🎵 ${ev.generos.slice(0,2).join(' · ')}</span>` : ''}
      </div>
      ${ev.destacado ? `<div class="ev-destacado">${ev.destacado.slice(0,130)}${ev.destacado.length>130?'…':''}</div>` : ''}
      <div class="ev-footer">
        <div class="ev-asistentes">${ev.asistentes ? `${ev.asistentes} van` : ''}</div>
        <a class="ev-link" href="${ev.url}" target="_blank" rel="noopener">${ev.fuente === 'Ticketmaster' ? 'Entradas en Ticketmaster →' : 'Ver en RA →'}</a>
      </div>
    `;
    grid.appendChild(card);
  });
  if (events.length) bub.appendChild(grid);

  wrap.appendChild(bub);

  if (opts.length) {
    const optDiv = document.createElement('div');
    optDiv.className = 'opts';
    opts.forEach(o => {
      const btn = document.createElement('button');
      btn.className = 'opt'; btn.textContent = o;
      if (o === OPT_CALENDARIO) btn.classList.add('opt-cal');
      btn.onclick = () => {
        optDiv.remove();
        if (o === OPT_CALENDARIO) openCalendar();
        else handleSend(o);
      };
      optDiv.appendChild(btn);
    });
    wrap.appendChild(optDiv);
  }

  const t = document.createElement('div');
  t.className = 'time'; t.textContent = now();
  wrap.appendChild(t);
  msgs.appendChild(wrap);
  msgs.scrollTop = msgs.scrollHeight;
}

function showTyping() {
  removeWelcome();
  const msgs = document.getElementById('msgs');
  const w = document.createElement('div');
  w.className = 'msg bot'; w.id = 'typing';
  const b = document.createElement('div');
  b.className = 'bubble';
  b.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  w.appendChild(b); msgs.appendChild(w);
  msgs.scrollTop = msgs.scrollHeight;
}
function hideTyping() { const t = document.getElementById('typing'); if (t) t.remove(); }

// ── CALENDARIO ─────────────────────────────────────────────────────────────
const OPT_CALENDARIO = '📅 Elegir fechas';
const MAX_DIAS = 7;
const MESES_LARGOS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

function isoDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function hoy0() { const d = new Date(); d.setHours(0,0,0,0); return d; }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function diffDias(a, b) { return Math.round((b - a) / 86400000); }

function openCalendar() {
  if (busy) return;
  const prev = document.getElementById('cal-msg');
  if (prev) prev.remove();
  removeWelcome();

  const state = { start: null, end: null, mes: new Date(hoy0().getFullYear(), hoy0().getMonth(), 1), note: '' };
  const msgs = document.getElementById('msgs');
  const wrap = document.createElement('div');
  wrap.className = 'msg bot'; wrap.id = 'cal-msg';
  const cal = document.createElement('div');
  cal.className = 'cal';
  wrap.appendChild(cal);
  msgs.appendChild(wrap);

  function setRango(a, b) { state.start = a; state.end = b; state.note = ''; render(); }

  function pick(d) {
    const { start, end } = state;
    state.note = '';
    if (!start || end) { state.start = d; state.end = null; }
    else if (d.getTime() === start.getTime()) { state.end = null; }
    else if (d < start) { state.start = d; }
    else if (diffDias(start, d) >= MAX_DIAS) {
      state.end = addDays(start, MAX_DIAS - 1);
      state.note = `Máximo ${MAX_DIAS} días por búsqueda`;
    } else { state.end = d; }
    render();
  }

  function etiqueta() {
    const { start, end } = state;
    if (!start) return 'Elegí uno o más días';
    if (!end) return `Buscar el ${formatFecha(isoDate(start)).toLowerCase()}`;
    return `Buscar del ${formatFecha(isoDate(start)).toLowerCase()} al ${formatFecha(isoDate(end)).toLowerCase()}`;
  }

  function confirmar() {
    const { start, end } = state;
    if (!start) return;
    const a = isoDate(start);
    const txt = end
      ? `Del ${formatFecha(a)} al ${formatFecha(isoDate(end))} (${a}/${isoDate(end)})`
      : `El ${formatFecha(a)} (${a})`;
    wrap.remove();
    handleSend(txt);
  }

  function render() {
    const hoy = hoy0();
    const y = state.mes.getFullYear(), m = state.mes.getMonth();
    const primero = new Date(y, m, 1);
    const offset = (primero.getDay() + 6) % 7; // lunes primero
    const diasMes = new Date(y, m + 1, 0).getDate();
    const esMesActual = y === hoy.getFullYear() && m === hoy.getMonth();
    const { start, end } = state;

    let celdas = ['L','M','X','J','V','S','D'].map(d => `<div class="cal-dow">${d}</div>`).join('');
    for (let i = 0; i < offset; i++) celdas += '<div></div>';
    for (let n = 1; n <= diasMes; n++) {
      const d = new Date(y, m, n);
      const cls = ['cal-day'];
      if (d.getTime() === hoy.getTime()) cls.push('today');
      const t = d.getTime();
      if (start && t === start.getTime()) cls.push('sel', 'start', end ? 'has-end' : '');
      if (end && t === end.getTime()) cls.push('sel', 'end');
      if (start && end && t > start.getTime() && t < end.getTime()) cls.push('in-range');
      celdas += `<button class="${cls.join(' ')}" data-iso="${isoDate(d)}" ${d < hoy ? 'disabled' : ''}>${n}</button>`;
    }

    cal.innerHTML = `
      <div class="cal-quick">
        <button class="opt" data-q="hoy">Hoy</button>
        <button class="opt" data-q="manana">Mañana</button>
        <button class="opt" data-q="finde">Este finde</button>
        <button class="opt" data-q="finde2">Próximo finde</button>
      </div>
      <div class="cal-top">
        <button class="cal-nav" data-nav="-1" ${esMesActual ? 'disabled' : ''}>‹</button>
        <div class="cal-title">${MESES_LARGOS[m]} ${y}</div>
        <button class="cal-nav" data-nav="1">›</button>
      </div>
      <div class="cal-grid">${celdas}</div>
      <div class="cal-note">${state.note || (start && !end ? 'Tocá otro día para elegir un rango' : '')}</div>
      <div class="cal-actions">
        <button class="cal-cancel">Cancelar</button>
        <button class="cal-ok" ${start ? '' : 'disabled'}>${etiqueta()}</button>
      </div>`;

    cal.querySelectorAll('.cal-day:not(:disabled)').forEach(b =>
      b.onclick = () => { const [yy, mm, dd] = b.dataset.iso.split('-').map(Number); pick(new Date(yy, mm - 1, dd)); });
    cal.querySelectorAll('.cal-nav').forEach(b =>
      b.onclick = () => { state.mes = new Date(y, m + Number(b.dataset.nav), 1); render(); });
    cal.querySelectorAll('[data-q]').forEach(b => b.onclick = () => {
      const q = b.dataset.q, wd = hoy.getDay(); // 0=dom
      if (q === 'hoy') setRango(hoy, null);
      if (q === 'manana') setRango(addDays(hoy, 1), null);
      if (q === 'finde' || q === 'finde2') {
        // viernes de esta semana (si hoy es sáb/dom, el viernes que ya pasó)
        const vieEsta = wd === 0 ? addDays(hoy, -2) : addDays(hoy, 5 - wd);
        let a, b;
        if (q === 'finde') { a = vieEsta < hoy ? hoy : vieEsta; b = addDays(vieEsta, 2); }
        else { a = addDays(vieEsta, 7); b = addDays(vieEsta, 9); }
        state.mes = new Date(a.getFullYear(), a.getMonth(), 1);
        setRango(a, b.getTime() === a.getTime() ? null : b);
      }
    });
    cal.querySelector('.cal-ok').onclick = confirmar;
    cal.querySelector('.cal-cancel').onclick = () => wrap.remove();
    msgs.scrollTop = msgs.scrollHeight;
  }

  render();
}

function getOpts(reply) {
  // Mirar solo la última pregunta del bot (lo que empieza con el último "¿"),
  // así "buscamos en la franja de tarde... ¿precio?" muestra opciones de precio y no de horario
  const idx = reply.lastIndexOf('¿');
  const low = (idx >= 0 ? reply.slice(idx) : reply).toLowerCase();
  if (low.includes('ciudad') || low.includes('dónde') || low.includes('donde'))
    return ['Buenos Aires', 'Berlin', 'Barcelona', 'London', 'Amsterdam', 'Madrid'];
  if ((low.includes('viernes') && (low.includes('sábado') || low.includes('sabado'))) || low.includes('qué día') || low.includes('que dia') || low.includes('cuándo') || low.includes('cuando'))
    return [OPT_CALENDARIO, 'Hoy', 'Mañana', 'Viernes', 'Sábado', 'Domingo', 'Todo el finde'];
  if (low.includes('tarde') || low.includes('noche') || low.includes('horario') || low.includes('franja') || low.includes('sunset') || low.includes('after'))
    return ['🌤️ Tarde (14-20hs)', '🌅 Sunset (18-21hs)', '🌙 Noche (21-03hs)', '☀️ Afters (05-09hs)', 'Me da igual'];
  if (low.includes('gratis') || low.includes('precio') || low.includes('entrada'))
    return ['Gratis', 'Barato (<15€)', 'Normal (15-30€)', 'Me da igual'];
  if (low.includes('género') || low.includes('genero') || low.includes('música'))
    return ['Techno', 'House', 'Tech House', 'Progressive', 'Melodic', 'Drum & Bass', 'Otro'];
  return [];
}

async function handleSend(texto) {
  if (!texto.trim() || busy) return;
  busy = true;
  document.getElementById('sendbtn').disabled = true;
  document.getElementById('inp').value = '';

  addMsg('user', texto);
  history.push({ role: 'user', content: texto });
  showTyping();

  try {
    const res = await fetch(`${RAILWAY}/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history })
    });
    const data = await res.json();
    hideTyping();

    const reply   = data.reply || '';
    const eventos = data.eventos || [];
    const total   = data.total_ra || 0;
    const filtros = data.filtros;

    history.push({ role: 'assistant', content: reply });

    if (filtros && eventos.length > 0) {
      const tipo = filtros.tipo || 'fecha';
      let intro = '';
      if (tipo === 'fecha') {
        const ciudadTxt = (filtros.ciudad || '').replace(/\b\w/g, c => c.toUpperCase());
        const generoTxt = filtros.genero ? ` de ${filtros.genero}` : '';
        intro = total > eventos.length
          ? `¡Encontré ${total} eventos${generoTxt} en ${ciudadTxt}! 🔥 Te dejo los ${eventos.length} que más gente convocan.`
          : `¡Mirá lo que encontré${generoTxt} en ${ciudadTxt}! 🔥`;
        intro += `\n💡 Los precios son orientativos, chequealos en RA antes de comprar.`;
      } else if (tipo === 'artista') {
        intro = reply || `Próximas fechas de ${(filtros.artista||'').replace(/-/g,' ')}:`;
      } else if (tipo === 'venue') {
        intro = `Esto hay en ${filtros.venue || 'ese venue/disco'}:`;
      } else {
        intro = filtros.query ? `Resultados para "${filtros.query}":` : 'Acá van los resultados:';
      }
      addMsg('bot', intro, ['🔄 Nueva búsqueda', OPT_CALENDARIO], eventos);
    } else if (filtros && eventos.length === 0 && reply && filtros.tipo !== 'fecha') {
      addMsg('bot', reply, ['🔄 Nueva búsqueda']);
    } else if (filtros && eventos.length === 0) {
      const opcionesSinRes = [];
      if (filtros.franja || filtros.hora_min) opcionesSinRes.push('Sin filtro de horario');
      if (filtros.gratis || filtros.precio_max) opcionesSinRes.push('Sin filtro de precio');
      if (filtros.genero) opcionesSinRes.push('Cualquier género');
      opcionesSinRes.push(OPT_CALENDARIO, '🔄 Nueva búsqueda');
      const pistas = [filtros.franja || filtros.hora_min ? 'el horario' : null,
                      filtros.gratis || filtros.precio_max ? 'el precio' : null,
                      filtros.genero ? 'el género' : null].filter(Boolean);
      const sugerencia = pistas.length ? `¿Probamos aflojando ${pistas.join(' o ')}?` : '¿Probamos con otra fecha?';
      addMsg('bot',
        `No encontré exactamente lo que buscás 😕 ${sugerencia}` +
        (total ? `\nEsos días hay ${total} eventos en total en ${filtros.ciudad || 'la ciudad'}, así que seguro hay algo para vos.` : ''),
        opcionesSinRes
      );
    } else {
      addMsg('bot', reply, getOpts(reply));
    }
  } catch(e) {
    hideTyping();
    addMsg('bot', 'Uy, se me cortó algo 😅 ¿Lo intentamos de nuevo?', ['🔄 Reiniciar']);
  }

  busy = false;
  document.getElementById('sendbtn').disabled = false;
  document.getElementById('inp').focus();
}

function send() { handleSend(document.getElementById('inp').value.trim()); }
document.getElementById('inp').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); send(); }
});

showWelcome();
</script>
