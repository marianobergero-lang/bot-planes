<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Let's PartIA · by Stepwise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0e1518;
    --surface:   #173F4F;
    --card:      #1a3040;
    --border:    #1f4a5e;
    --border2:   #2a5c72;
    --accent:    #E9682E;
    --accent2:   #c94f18;
    --petroleo:  #173F4F;
    --arena:     #E9DFD0;
    --text:      #f5f2ee;
    --muted:     #c0ccd0;
    --dim:       #8aaab5;
    --green:     #4cde8f;
    --blue:      #4cb8ff;
    --orange:    #E9682E;
    --radius:    12px;
  }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-size: 15px;
  }

  /* HEADER */
  header {
    width: 100%;
    padding: 14px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .header-left { display: flex; align-items: center; gap: 12px; }

  .logo-mark {
    width: 36px; height: 36px;
    background: var(--accent);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .logo-mark svg { width: 19px; height: 19px; }

  .app-name {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.4px;
    color: var(--text);
  }
  .app-name span { color: var(--accent); }

  .app-sub {
    font-size: 11px;
    color: var(--muted);
    margin-top: 1px;
    letter-spacing: 0.1px;
  }

  .powered {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--dim);
  }
  .stepwise-logo {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: -0.3px;
  }

  /* CHAT */
  .chat {
    width: 100%;
    max-width: 720px;
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #msgs {
    flex: 1;
    overflow-y: auto;
    padding: 24px 20px 12px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .msg { display: flex; flex-direction: column; gap: 6px; animation: fadein .2s ease; }
  .msg.bot  { align-items: flex-start; }
  .msg.user { align-items: flex-end; }

  .bubble {
    max-width: 82%;
    padding: 12px 16px;
    border-radius: var(--radius);
    font-size: 14px;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;
    letter-spacing: -0.1px;
  }
  .bot .bubble {
    background: var(--card);
    border: 1px solid var(--border);
    border-bottom-left-radius: 3px;
    color: var(--text);
  }
  .user .bubble {
    background: #2a1a0e;
    border: 1px solid #4a2e18;
    border-bottom-right-radius: 3px;
    color: #f0c8a0;
  }

  /* OPCIONES */
  .opts { display: flex; flex-wrap: wrap; gap: 8px; max-width: 82%; }
  .opt {
    background: transparent;
    border: 1px solid var(--border2);
    color: var(--muted);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    transition: all .15s;
  }
  .opt:hover {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 500;
  }

  .time { font-size: 11px; color: var(--dim); padding: 0 4px; }

  /* EVENTO CARD */
  .ev-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    gap: 7px;
    width: 100%;
    transition: border-color .15s;
  }
  .ev-card:hover { border-color: var(--accent); }

  .ev-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .ev-title { font-weight: 500; font-size: 14px; color: var(--text); flex: 1; line-height: 1.4; }

  .ev-badge {
    font-size: 11px; font-weight: 500;
    padding: 3px 9px; border-radius: 20px;
    white-space: nowrap; flex-shrink: 0;
    letter-spacing: 0.2px;
  }
  .badge-gratis { background: #0a2818; color: var(--green); border: 1px solid #1a4828; }
  .badge-barato { background: #0a2010; color: #90e060; border: 1px solid #1a4020; }
  .badge-normal { background: #101828; color: var(--blue); border: 1px solid #1a3040; }
  .badge-caro   { background: #2a1808; color: var(--accent); border: 1px solid #4a2e18; }
  .badge-nd     { background: var(--card); color: var(--dim); border: 1px solid var(--border); }

  .ev-artists { font-size: 12.5px; color: var(--muted); }

  .ev-meta {
    font-size: 12px; color: var(--dim);
    display: flex; gap: 14px; flex-wrap: wrap; align-items: center;
  }

  .ev-date {
    font-size: 12px; font-weight: 600;
    color: var(--accent);
    letter-spacing: 0.2px;
  }

  .ev-destacado {
    font-size: 12px; color: var(--muted);
    font-style: italic; line-height: 1.5;
    border-left: 2px solid var(--accent);
    padding-left: 10px;
    opacity: .8;
  }

  .ev-footer {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 2px;
  }
  .ev-asistentes { font-size: 11px; color: var(--dim); }
  .ev-link {
    font-size: 12px; font-weight: 600;
    color: var(--accent); text-decoration: none;
    letter-spacing: -0.1px;
  }
  .ev-link:hover { color: var(--accent2); }

  /* TYPING */
  .typing { display: flex; gap: 5px; align-items: center; padding: 4px 0; }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--dim);
    animation: bounce .9s infinite;
  }
  .typing span:nth-child(2) { animation-delay: .15s; }
  .typing span:nth-child(3) { animation-delay: .3s; }

  @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-5px)} }
  @keyframes fadein { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }

  /* INPUT */
  .input-area {
    padding: 14px 20px 22px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    gap: 10px;
    align-items: center;
    width: 100%;
    max-width: 720px;
    flex-shrink: 0;
  }

  #inp {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 11px 16px;
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color .15s;
  }
  #inp:focus { border-color: var(--accent); }
  #inp::placeholder { color: var(--dim); }

  #sendbtn {
    width: 44px; height: 44px;
    border-radius: 10px; border: none;
    background: var(--accent);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background .15s;
  }
  #sendbtn:hover { background: var(--accent2); }
  #sendbtn:disabled { opacity: .4; cursor: default; }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18V5l12-2v13"/>
        <circle cx="6" cy="18" r="3"/>
        <circle cx="18" cy="16" r="3"/>
      </svg>
    </div>
    <div>
      <div class="app-name">Let's Part<span>IA</span></div>
      <div class="app-sub">Many events · Your event</div>
    </div>
  </div>
  <div class="powered">
    <span>powered by</span>
    <div class="stepwise-logo">stepwise</div>
  </div>
</header>

<div class="chat">
  <div id="msgs"></div>
  <div class="input-area">
    <input id="inp" placeholder="Ciudad, DJ, venue, fecha... escribí lo que querés" type="text">
    <button id="sendbtn" onclick="send()" aria-label="Enviar">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="#fff"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script>
const RAILWAY = "https://bot-planes-production.up.railway.app";
let history = [];
let busy = false;

function now() { return new Date().toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' }); }

const DIAS  = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const MESES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

function formatFecha(fechaStr) {
  if (!fechaStr) return '';
  const d = new Date(fechaStr + 'T12:00:00');
  return `${DIAS[d.getDay()]} ${d.getDate()} ${MESES[d.getMonth()]}`;
}

function badgeInfo(ev) {
  if (ev.gratis) return { cls: 'badge-gratis', txt: '✦ Gratis' };
  const p = ev.precio_num;
  const raw = ev.precio || '';
  const hasSym = /[£$€]/.test(raw);
  const sym = hasSym ? '' : '€';
  if (p === null || p === undefined) return { cls: 'badge-nd', txt: '· Ver precio' };
  if (p < 15)  return { cls: 'badge-barato', txt: `↓ ${sym}${raw}` };
  if (p <= 30) return { cls: 'badge-normal', txt: `· ${sym}${raw}` };
  return { cls: 'badge-caro', txt: `↑ ${sym}${raw}` };
}

function addMsg(role, text, opts = [], events = []) {
  const msgs = document.getElementById('msgs');
  const wrap = document.createElement('div');
  wrap.className = `msg ${role}`;

  const bub = document.createElement('div');
  bub.className = 'bubble';
  bub.textContent = text;

  events.forEach(ev => {
    const card = document.createElement('div');
    card.className = 'ev-card';
    const artists = (ev.artistas || []).slice(0, 4).join(' · ') + ((ev.artistas||[]).length > 4 ? ` +${ev.artistas.length-4}` : '');
    const horaInicio = ev.hora && ev.hora !== '23:59' ? ev.hora : null;
    const horaFin = ev.hora_fin && ev.hora_fin !== '23:59' ? ev.hora_fin : null;
    let horaStr = '';
    if (horaInicio && horaFin) horaStr = `${horaInicio} → ${horaFin}hs`;
    else if (horaInicio) horaStr = `desde las ${horaInicio}hs`;
    else horaStr = 'Noche';
    const { cls, txt } = badgeInfo(ev);
    const fecha = formatFecha(ev.fecha);

    card.innerHTML = `
      <div class="ev-header">
        <div class="ev-title">${ev.titulo}</div>
        <div class="ev-badge ${cls}">${txt}</div>
      </div>
      ${artists ? `<div class="ev-artists">👤 ${artists}</div>` : ''}
      <div class="ev-meta">
        ${fecha ? `<span class="ev-date">📅 ${fecha}</span>` : ''}
        <span>🕐 ${horaStr}</span>
        ${ev.venue ? `<span>📍 ${ev.venue}</span>` : ''}
      </div>
      ${ev.destacado ? `<div class="ev-destacado">${ev.destacado.slice(0,130)}${ev.destacado.length>130?'…':''}</div>` : ''}
      <div class="ev-footer">
        <div class="ev-asistentes">${ev.asistentes ? `${ev.asistentes} personas van` : ''}</div>
        <a class="ev-link" href="${ev.url}" target="_blank">Ver en RA →</a>
      </div>
    `;
    bub.appendChild(card);
  });

  wrap.appendChild(bub);

  if (opts.length) {
    const optDiv = document.createElement('div');
    optDiv.className = 'opts';
    opts.forEach(o => {
      const btn = document.createElement('button');
      btn.className = 'opt'; btn.textContent = o;
      btn.onclick = () => { optDiv.remove(); handleSend(o); };
      optDiv.appendChild(btn);
    });
    wrap.appendChild(optDiv);
  }

  const t = document.createElement('div');
  t.className = 'time'; t.textContent = now();
  wrap.appendChild(t);
  msgs.appendChild(wrap);
  msgs.scrollTop = msgs.scrollHeight;
}

function showTyping() {
  const msgs = document.getElementById('msgs');
  const w = document.createElement('div');
  w.className = 'msg bot'; w.id = 'typing';
  const b = document.createElement('div');
  b.className = 'bubble';
  b.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  w.appendChild(b); msgs.appendChild(w);
  msgs.scrollTop = msgs.scrollHeight;
}
function hideTyping() { const t = document.getElementById('typing'); if (t) t.remove(); }

function getOpts(reply) {
  const low = reply.toLowerCase();
  if (low.includes('ciudad') || low.includes('dónde') || low.includes('donde'))
    return ['Buenos Aires', 'Berlin', 'Barcelona', 'London', 'Amsterdam', 'Madrid'];
  if (low.includes('viernes') && (low.includes('sábado') || low.includes('sabado')))
    return ['Viernes', 'Sábado', 'Todo el finde'];
  if (low.includes('tarde') || low.includes('noche') || low.includes('horario'))
    return ['Tarde (18hs)', 'Noche (22hs)', 'Madrugada (00hs)', 'Me da igual'];
  if (low.includes('cubierto') || low.includes('aire libre'))
    return ['Cubierto (club)', 'Aire libre', 'Me da igual'];
  if (low.includes('gratis') || low.includes('precio') || low.includes('entrada'))
    return ['Gratis', 'Barato (<15€)', 'Normal (15-30€)', 'Me da igual'];
  return [];
}

async function handleSend(texto) {
  if (!texto.trim() || busy) return;
  busy = true;
  document.getElementById('sendbtn').disabled = true;
  document.getElementById('inp').value = '';

  addMsg('user', texto);
  history.push({ role: 'user', content: texto });
  showTyping();

  try {
    const res = await fetch(`${RAILWAY}/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history })
    });
    const data = await res.json();
    hideTyping();

    const reply   = data.reply || '';
    const eventos = data.eventos || [];
    const total   = data.total_ra || 0;
    const filtros = data.filtros;

    history.push({ role: 'assistant', content: reply });

    if (filtros && eventos.length > 0) {
      const tipo = filtros.tipo || 'fecha';
      let intro = '';
      if (tipo === 'fecha') {
        const n = eventos.length;
        intro = `Hay ${total} eventos en ${filtros.ciudad} — acá están los ${n} que mejor matchean lo que buscás:`;
      } else if (tipo === 'artista') {
        const nombre = (filtros.artista || '').replace(/-/g,' ');
        intro = `Encontré ${eventos.length} evento${eventos.length > 1 ? 's' : ''} de ${nombre}:`;
      } else if (tipo === 'venue') {
        intro = `Esto hay en ${filtros.venue || 'ese venue'}:`;
      } else {
        intro = filtros.query ? `Resultados para "${filtros.query}":` : 'Acá van los resultados:';
      }
      addMsg('bot', intro, ['🔄 Nueva búsqueda'], eventos);
    } else if (filtros && eventos.length === 0) {
      addMsg('bot',
        `Busqué en RA pero no encontré nada con esos filtros.${total ? `\nEn total hay ${total} eventos — probá sin filtro de hora o precio.` : ''}`,
        ['🔄 Nueva búsqueda', 'Sin filtro de hora', 'Sin filtro de precio']
      );
    } else {
      addMsg('bot', reply, getOpts(reply));
    }
  } catch(e) {
    hideTyping();
    addMsg('bot', 'Algo falló conectando con el servidor. Intentá de nuevo.', ['🔄 Reiniciar']);
  }

  busy = false;
  document.getElementById('sendbtn').disabled = false;
  document.getElementById('inp').focus();
}

function send() { handleSend(document.getElementById('inp').value.trim()); }
document.getElementById('inp').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); send(); }
});

(async () => {
  showTyping();
  try {
    const res = await fetch(`${RAILWAY}/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: [{ role: 'user', content: 'hola!' }] })
    });
    const data = await res.json();
    hideTyping();
    history.push({ role: 'user', content: 'hola!' });
    history.push({ role: 'assistant', content: data.reply });
    addMsg('bot', data.reply,
      ['Buenos Aires', 'Berlin', 'Barcelona', 'London', 'Amsterdam', 'Madrid']
    );
  } catch {
    hideTyping();
    addMsg('bot', '¡Hola! ¿Qué plan estás buscando? Podés decirme una ciudad, un DJ/artista, un venue/disco o una fecha determinada... y buscamos tu plan ideal!',
      ['Buenos Aires', 'Berlin', 'Barcelona', 'London', 'Amsterdam', 'Madrid']
    );
  }
})();
</script>
</body>
</html>
